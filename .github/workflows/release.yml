name: Release & Version Bump

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[version-bump]')"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Read current version
        id: current
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump main to release version
        if: steps.current.outputs.is_snapshot == 'true'
        run: |
          RELEASE=${CURRENT_VERSION%-SNAPSHOT}
          mvn versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: release $RELEASE [version-bump]"
          git push origin main
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}

      - name: Bump develop to next SNAPSHOT
        if: steps.current.outputs.is_snapshot == 'true'
        run: |
          RELEASE=${CURRENT_VERSION%-SNAPSHOT}
          MAJOR=$(echo "$RELEASE" | cut -d. -f1)
          MINOR=$(echo "$RELEASE" | cut -d. -f2)
          PATCH=$(echo "$RELEASE" | cut -d. -f3)
          PATCH=${PATCH:-0}
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          git checkout develop
          git pull origin develop
          mvn versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: bump develop to $NEXT_VERSION [version-bump]"
          git push origin develop
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
