name: Release & Version Bump

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[version-bump]')"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Read current version
        id: current
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.current.outputs.is_snapshot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare main release version
        if: steps.current.outputs.is_snapshot == 'true'
        id: release
        run: |
          RELEASE=${CURRENT_VERSION%-SNAPSHOT}
          echo "version=$RELEASE" >> $GITHUB_OUTPUT
          mvn versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}

      - name: Build release version before publishing bump
        if: steps.current.outputs.is_snapshot == 'true'
        run: mvn -B verify --no-transfer-progress

      - name: Publish main release bump
        if: steps.current.outputs.is_snapshot == 'true'
        run: |
          git add pom.xml
          git commit -m "chore: release $RELEASE [version-bump]"
          git push origin main
        env:
          RELEASE: ${{ steps.release.outputs.version }}

      - name: Prepare develop next SNAPSHOT
        if: steps.current.outputs.is_snapshot == 'true'
        id: next
        run: |
          RELEASE=${CURRENT_VERSION%-SNAPSHOT}
          MAJOR=$(echo "$RELEASE" | cut -d. -f1)
          MINOR=$(echo "$RELEASE" | cut -d. -f2)
          PATCH=$(echo "$RELEASE" | cut -d. -f3)
          PATCH=${PATCH:-0}
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          git fetch origin develop
          git checkout develop
          git pull --ff-only origin develop
          mvn versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}

      - name: Build develop next SNAPSHOT before publishing bump
        if: steps.current.outputs.is_snapshot == 'true'
        run: mvn -B verify --no-transfer-progress

      - name: Publish develop version bump
        if: steps.current.outputs.is_snapshot == 'true'
        run: |
          if git diff --quiet -- pom.xml; then
            echo "Develop is already at $NEXT_VERSION; nothing to commit."
            exit 0
          fi
          git add pom.xml
          git commit -m "chore: bump develop to $NEXT_VERSION [version-bump]"
          git push origin develop
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
