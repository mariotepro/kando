<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kando — Acceder</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('kando_theme');
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        }());
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css(v='20260605c')}"/>
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">kando</span>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
        Sesión cerrada.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   autofocus placeholder="tu usuario"/>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>
</div>

</body>
</html>
