<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kando — Etiquetas</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('kando_theme');
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        }());
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css(v='20260605c')}"/>
</head>
<body class="app-body">

<nav class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/board}" style="text-decoration:none;display:flex;align-items:center;gap:.5rem">
            <span class="logo-icon">◈</span>
            <span class="logo-text">kando</span>
        </a>
    </div>
    <div class="navbar-actions">
        <a th:href="@{/board}" class="btn btn-ghost btn-sm">← Tablero</a>
    </div>
</nav>

<div class="page-content">
    <div class="page-header">
        <h1>Etiquetas</h1>
    </div>

    <div class="labels-grid" id="labelsList">
        <div th:each="lbl : ${labels}" class="label-row card" th:data-label-id="${lbl.id}">
            <button class="label-color-btn"
                    type="button"
                    th:style="'background:' + ${lbl.color}"
                    th:data-color="${lbl.color}"
                    title="Cambiar color"></button>
            <input class="label-name-input"
                   th:value="${lbl.name}"
                   maxlength="64"
                   placeholder="Nombre de etiqueta"/>
            <button class="label-delete-btn" type="button" title="Eliminar etiqueta"
                    th:data-label-id="${lbl.id}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4h8v2"/>
                    <path d="M19 6l-1.5 14a2 2 0 0 1-2 1.5H8.5a2 2 0 0 1-2-1.5L5 6"/>
                    <path d="M10 11v5M14 11v5"/>
                </svg>
            </button>
        </div>

        <!-- New label row — always visible at the bottom -->
        <div class="label-row label-row-new card">
            <button class="label-color-btn"
                    type="button"
                    id="newLabelColorBtn"
                    style="background:#cba6f7"
                    data-color="#cba6f7"
                    title="Elegir color"></button>
            <input class="label-name-input"
                   id="newLabelName"
                   maxlength="64"
                   placeholder="Nueva etiqueta…"/>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(labels)}" class="empty-state">
        Escribe el nombre de la primera etiqueta y pulsa Enter para crearla.
    </p>
</div>

<script th:src="@{/js/labels.js}"></script>
</body>
</html>
