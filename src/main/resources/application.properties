server.port=3000
spring.application.name=kando

# JPA
# JPA must not validate before first-run migrations have a chance to create the schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — managed manually via SetupController on first run / migrations
spring.flyway.enabled=false

# Thymeleaf
spring.thymeleaf.cache=true

# Session — 30 days; remember-me cookie also set in SecurityConfig for cross-restart persistence
server.servlet.session.timeout=30d

# Logging
logging.level.com.kando=INFO
logging.level.org.flywaydb=INFO
